<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática: imagens e caminhos relativos</title>
</head>
<body>
    <h1>Exercício com imagens</h1>
    <p>Prática das tags img, figure e figcaption e do uso de caminhos relativos.</p>

    <figure>
        <img src="../midias/imagens/novo simbolo canal.png"
             alt="Imagem utilizada no exercício de HTML"
             width="360">
        <figcaption>Primeira imagem, carregada da pasta de mídias.</figcaption>
    </figure>

    <figure>
        <img src="../midias/imagens/noivo banner canal.png"
             alt="Banner utilizado no exercício de HTML"
             width="600">
        <figcaption>Segunda imagem, com largura personalizada.</figcaption>
    </figure>
</body>
</html>
