<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links e âncoras HTML</title>
</head>
<body>
  <h1 id="inicio">Links e âncoras</h1>
  <p><a href="../midias/imagens/novo simbolo canal.png">Abrir imagem do símbolo do canal</a></p>
  <p><a href="../midias/imagens/noivo banner canal.png">Abrir imagem do banner</a></p>
  <p><a href="#explicacao">Ir para a explicação</a></p>
  <h2 id="explicacao">Como funcionam as âncoras?</h2>
  <p>O atributo <code>id</code> identifica um trecho da página. Um link com <code>href="#explicacao"</code> leva até ele.</p>
  <a href="#inicio">Voltar ao início</a>
</body>
</html>
