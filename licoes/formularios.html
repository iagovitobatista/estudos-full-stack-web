<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulários — Primeiros exercícios</title>
</head>
<body>
  <h1>Formulários em HTML</h1>
  <p>Exemplo de estudo com form, input, textarea e button. Não existe autenticação ou processamento em servidor neste exercício.</p>
  <!-- GET envia os dados na URL e não deve ser usado para senhas. POST não substitui HTTPS. -->
  <form action="processa.html" method="get">
    <p>
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com">
    </p>
    <p>
      <label for="comentario">Comentário</label>
      <textarea id="comentario" name="comentario" placeholder="Digite seu comentário"></textarea>
    </p>
    <button type="submit">Enviar exemplo</button>
  </form>
</body>
</html>
