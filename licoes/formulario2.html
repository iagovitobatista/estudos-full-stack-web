<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Mais sobre o formulario</h1>

    <form action="processa.html" method="get">

        <!--
        Label = legenda para item da interface
        for = associa o label ao id do input
        -->

        <label>name</label>
        <input type="text" name="nome" id="name">

        <!-- Forma correta de se fazer -->

        <label for="EMAILS">EMAILS</label>
        <input type="text" name="EMAIL" id="EMAILS">
        <br>

        Gênero <br>

        <input type="radio" name="genero" value="femenino">Femenino
        <input type="radio" name="genero" value="masculino">masculino

        <input type="submit" value="cadastrar">

        <br><br>

        Estilo musical <br>

        <input type="checkbox" name="estilo" value="rock">rock
        <input type="checkbox" name="estilo" value="pop">pop
        <input type="checkbox" name="estilo" value="sertanejo">sertanejo

        <br><br>

        Estado:

        <select name="estado">
            <option value="">Selecione</option>
            <option value="sp">SÃO PAULO</option>
            <option value="rj">RIO DE JANEIRO</option>
            <option value="mg">MINAS GERAIS</option>
            <option value="ce">CEARA</option>
        </select>

        <br><br>

        Upload de arquivos:
        <input type="file" name="arquivos">

    </form>

    <!--
    Fieldset & legend
    fieldset = conjunto de campos
    legend = legenda para conjunto de campos
    -->

    <form>

        <fieldset>
            <legend>dados pessoais</legend>

            <label>name</label>
            <input type="text" name="nome" id="name">

            <!-- Forma correta de se fazer -->

            <label for="EMAILS-dados">EMAILS</label>
            <input type="text" name="EMAIL" id="EMAILS-dados">
            <br>

        </fieldset>

    </form>

</body>

</html>
