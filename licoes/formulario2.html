<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulários — Controles e agrupamentos</title>
</head>
<body>
  <h1>Mais sobre formulários</h1>
  <form action="processa.html" method="get">
    <p><label for="nome">Nome:</label> <input type="text" name="nome" id="nome"></p>
    <p><label for="email">E-mail:</label> <input type="email" name="email" id="email"></p>
    <fieldset>
      <legend>Gênero</legend>
      <label><input type="radio" name="genero" value="feminino"> Feminino</label>
      <label><input type="radio" name="genero" value="masculino"> Masculino</label>
      <label><input type="radio" name="genero" value="outro"> Outro</label>
    </fieldset>
    <fieldset>
      <legend>Estilo musical</legend>
      <label><input type="checkbox" name="estilo" value="rock"> Rock</label>
      <label><input type="checkbox" name="estilo" value="pop"> Pop</label>
      <label><input type="checkbox" name="estilo" value="sertanejo"> Sertanejo</label>
    </fieldset>
    <p>
      <label for="estado">Estado:</label>
      <select id="estado" name="estado">
        <option value="">Selecione</option>
        <option value="sp">São Paulo</option>
        <option value="rj">Rio de Janeiro</option>
        <option value="mg">Minas Gerais</option>
        <option value="ce">Ceará</option>
      </select>
    </p>
    <p><label for="arquivo">Arquivo:</label> <input type="file" id="arquivo" name="arquivo"></p>
    <button type="submit">Cadastrar</button>
  </form>
  <h2>Exemplo de fieldset e legend</h2>
  <form action="processa.html" method="get">
    <fieldset>
      <legend>Dados pessoais</legend>
      <p><label for="nome2">Nome:</label> <input type="text" name="nome" id="nome2"></p>
      <p><label for="email2">E-mail:</label> <input type="email" name="email" id="email2"></p>
    </fieldset>
    <button type="submit">Enviar exemplo</button>
  </form>
</body>
</html>
