<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Elementos de imagem</title></head>
<body>
<h1>Imagens em HTML</h1>
<p>A tag <code>&lt;img&gt;</code> utiliza <code>src</code> para o caminho e <code>alt</code> para o texto alternativo.</p>
<figure><img src="../midias/imagens/novo simbolo canal.png" alt="Símbolo utilizado nos estudos" width="320"><figcaption>Exemplo com imagem, figure e figcaption.</figcaption></figure>
<p>Para voltar uma pasta no caminho relativo, use <code>../</code>. Para controlar a largura use <code>width</code>, e para altura <code>height</code>.</p>
</body></html>
