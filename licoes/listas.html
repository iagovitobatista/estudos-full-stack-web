<!--
ul>unordered list( lista não ordenada)
ol> Ordered list(lista ordenada)
li> List item( item da lista)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
<li>veiculos</li>
<li>honda</li>
<li>fiat</li>
    aqui é um subitem usando duas tags juntas <ul>
        <li>carros fiat</li>
        <li>carros fiat 2026</li>

</ul>
</li>

    </ul>
<h2>lista ordenada </h2>

<ol type="I"> 
    <!--nao é mais recomendado-->
    <li>veiculos</li>
<li>honda</li>
<li>fiat</li>
</ol>

</body>
</html>
