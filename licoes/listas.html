<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listas HTML</title>
</head>
<body>
  <h1>Exercícios de listas</h1>
  <!-- ul = lista não ordenada, ol = ordenada, li = item -->
  <h2>Lista não ordenada</h2>
  <ul>
    <li>Veículos
      <ul>
        <li>Honda</li>
        <li>Fiat
          <ul>
            <li>Carros Fiat</li>
            <li>Modelos Fiat 2026</li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>
  <h2>Lista ordenada</h2>
  <ol type="I">
    <li>Honda</li>
    <li>Fiat</li>
    <li>Outros fabricantes</li>
  </ol>
</body>
</html>
