<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Margin e Padding</title>
<style>
body{margin:0;font-family:Arial,sans-serif}#topo{background:dodgerblue;padding:10px}#topo a{display:inline-block;margin:8px;border:1px solid white;padding:6px;background:lightskyblue;color:#034372;border-radius:5px}
#area-promocao{background:purple}#promocao,#conteudo{max-width:1000px;margin:0 auto}#conteudo{padding:10px}img{max-width:100%;height:auto}.produtos img{width:170px}
</style></head>
<body><header id="topo"><img src="img/logo-magalu.png" width="200" alt="Logo de referência para o exercício"><nav><a href="#produtos">Produtos</a> <a href="#destaque">Destaque</a></nav></header>
<section id="area-promocao"><div id="promocao"><img src="img/Banner.png" alt="Banner do exercício"></div></section>
<main id="conteudo"><h1 id="produtos">Produtos</h1><div class="produtos">
<img src="img/produto1.jpg" alt="Produto ilustrativo 1"><img src="img/produto2.jpg" alt="Produto ilustrativo 2"><img src="img/produto3.jpg" alt="Produto ilustrativo 3"><img src="img/produto4.jpg" alt="Produto ilustrativo 4"></div>
<h2 id="destaque">Destaque</h2><p>Exercício prático para entender margin, padding, largura máxima e centralização.</p></main></body></html>
